$kind: collection
variables:
  web_url: ""
  token: ""
scripts:
  - type: http:afterResponse
    code: |-
      if (pm.response && pm.response.code === 200) {
        try {
          const res = pm.response.json();
          if (res && res.token) {
            pm.collectionVariables.set("token", res.token);
          }
        } catch (e) {
          // Response is not JSON, skip token extraction
        }
      }
    language: text/javascript
