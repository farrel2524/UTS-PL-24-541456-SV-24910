name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  backend-test:
    name: Backend test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer
          extensions: mbstring, pdo, sqlite, pdo_sqlite
          coverage: none
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      
      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
        
      - name: Build assets
        run: |
          npm ci
          npm run build
      
      - name: Run tests
        run: php artisan test
  
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci 
      
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000/api
  
  deploy:
    name: Build dan push
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: kode checkout
        uses: actions/checkout@v4

      - name: set image
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      
      - name: setup buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build dan push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./<your-backend-folder>
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}

      - name: Build dan push fonrtend
        uses: docker/build-push-action@v6
        with:
          context: ./<your-frontend-folder>
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-frontend${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ vars.API_URL }}
      
      - name: deploy
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "Pull ${IMAGE_PREFIX}-backend:${GITHUB_SHA},"
          echo "start APP_KEY dan DB_PASSWORD.."
